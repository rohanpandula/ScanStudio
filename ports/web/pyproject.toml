[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scanstudio-web"
version = "0.1.0"
description = "Simulator-only browser gateway for the ScanStudio engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.15,<0.16",
]

[project.scripts]
scanstudio-web = "scanstudio_web.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scanstudio_web"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
