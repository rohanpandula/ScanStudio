services:
  scanstudio-web:
    build:
      context: ../..
      dockerfile: ports/web/Dockerfile
    image: scanstudio-web:simulator
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SCANSTUDIO_WEB_PORT:-8787}:8787"
    environment:
      - "SCANSTUDIO_WEB_BIND=0.0.0.0"
      - "SCANSTUDIO_WEB_PORT=8787"
      - "SCANSTUDIO_WEB_AUTH_MODE=${SCANSTUDIO_WEB_AUTH_MODE:-token}"
      - "SCANSTUDIO_WEB_TOKEN=${SCANSTUDIO_WEB_TOKEN:-}"
      - "SCANSTUDIO_WEB_ALLOWED_ORIGINS=${SCANSTUDIO_WEB_ALLOWED_ORIGINS:?set the exact browser origin, including port}"
      # A key without `=` is forwarded only when the operator explicitly sets
      # it. Otherwise Settings infers Secure=true for HTTPS-only origins.
      - "SCANSTUDIO_WEB_COOKIE_SECURE"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2).read()"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
