name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and verify ${{ matrix.arch }} DMG
    # A universal bundle is impossible because the pinned cv2/numpy wheels are
    # not universal, so each architecture is built natively on its own runner
    # through the SAME verified `make dmg` path (codesign --deep --strict,
    # relocation-safe bridge check, SHA-256). If EITHER matrix cell fails,
    # fail-fast aborts the whole workflow and nothing is published.
    #
    # Intel runner label: GitHub-hosted Intel labels change over time. Per the
    # GitHub-hosted runners reference (docs.github.com, 2026-08) the current
    # standard Intel label is `macos-15-intel`; hosted-label availability is
    # NOT exposed through the API (gh api /repos/{owner}/{repo}/actions/runners
    # only lists self-hosted runners), so it cannot be probed in advance. We
    # hard-code `macos-15-intel` and let GitHub fail the job loudly if the
    # label is ever retired or unavailable on this account -- fail-loud is
    # acceptable for this gate (T-02-01-02). If it stops resolving, the
    # conservative fallback is the last Intel-only label, `macos-13`; update
    # BOTH this include and the package matrix in ci.yml together.
    strategy:
      fail-fast: true
      matrix:
        arch: [arm64, x86_64]
        include:
          - arch: arm64
            runs-on: macos-15
          - arch: x86_64
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    env:
      # See the package job in ci.yml: the relocatable package requires uv's
      # standalone CPython, not the runner image's framework Python. This is
      # the same verified `make dmg` path used locally, so a release is only
      # publishable if the exact signed app passes the packaging verification.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - name: coolscanpy PyPI sync gate
        # Owner policy (2026-08-08): a release may not ship driver code that
        # standalone `pip install coolscanpy` users would not have -- version
        # skew between the two makes field reports for the same film
        # incomparable. Content-compared against the latest published sdist
        # (version strings are checked second; an unbumped version with
        # changed code is exactly the failure mode). Publish the matching
        # coolscanpy release from the canonical repo first, then re-tag.
        run: bash scripts/check_coolscanpy_pypi_sync.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install optional SANE binding build prerequisite
        # The release does not copy Homebrew's libusb: package_app.sh builds
        # the signed app-owned copy from hash-pinned source. sane-backends is
        # needed only to compile the optional python-sane compatibility
        # binding included in the bundle.
        run: brew install sane-backends
      - name: Point the compiler at Homebrew's headers and libraries
        # GitHub Actions does not expand $(...) inside an `env:` block and the
        # Homebrew prefix varies by runner arch (/opt/homebrew on arm64,
        # /usr/local on x86_64), so resolve it here and export it through
        # GITHUB_ENV for every later step in this job.
        run: |
          echo "CPPFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Install locked bridge dependencies (with scanner extra)
        working-directory: bridge
        run: uv sync --locked --extra scanner
      - name: Resolve release version from the tag
        # The workflow only runs on `v*` tag pushes, so the exact-match tag
        # is authoritative; fall back to GITHUB_REF_NAME minus the leading v.
        run: |
          STAMP="$({ git describe --tags --exact-match HEAD 2>/dev/null || echo "$GITHUB_REF_NAME"; } | sed 's/^v//')"
          echo "RELEASE_VERSION=$STAMP" >> "$GITHUB_ENV"
          echo "SCANSTUDIO_RELEASE_VERSION=$STAMP" >> "$GITHUB_ENV"
          echo "Resolved release version: $STAMP"
      - name: Require the canonical optional-runtime release repository
        if: vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME == 'true'
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "rohanpandula/ScanStudio" ]]
      - name: Select and prove OpenSSL 3 for optional runtime trust
        if: vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME == 'true'
        run: |
          set -euo pipefail
          brew install openssl@3
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          ports/web/packaging/macos/require-openssl3.sh "$openssl_bin"
          echo "OPENSSL_BIN=$openssl_bin" >> "$GITHUB_ENV"
      - name: Configure optional runtime trust anchors without bundling it
        if: vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME == 'true'
        env:
          MANIFEST_KEY_ID: ${{ vars.SCANSTUDIO_WEB_MANIFEST_KEY_ID }}
          DEVELOPER_ID_TEAM: ${{ secrets.SCANSTUDIO_DEVELOPER_ID_TEAM }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_KEY_ID" =~ ^[0-9A-Za-z._-]{1,64}$ ]]
          [[ "$DEVELOPER_ID_TEAM" =~ ^[0-9A-Z]{10}$ ]]
          public_key="$GITHUB_WORKSPACE/ports/web/packaging/macos/manifest-keys/$MANIFEST_KEY_ID.pem"
          [[ -f "$public_key" && ! -L "$public_key" ]]
          {
            echo "SCANSTUDIO_WEB_RUNTIME_PUBLIC_KEY_PEM=$public_key"
            echo "SCANSTUDIO_WEB_RUNTIME_TEAM_ID=$DEVELOPER_ID_TEAM"
          } >> "$GITHUB_ENV"
      - name: Build and verify the local DMG
        # package_dmg.sh names the artifact ScanStudio-<version>-macOS-<arch>.dmg
        # (arch from uname -m, i.e. this runner's native arch) and refuses to
        # overwrite an existing artifact. It also verifies the mounted app's
        # code signature and runs test_packaged_bridge.sh on it; any failure
        # here aborts the job and nothing is released.
        working-directory: app/ScanStudio
        run: make dmg
      - name: Emit SHA256SUMS and arch-keyed latest.json
        working-directory: app/ScanStudio
        run: |
          scripts/emit_release_assets.sh ".build/ScanStudio-$RELEASE_VERSION-macOS-$(uname -m).dmg" "$RELEASE_VERSION" ".build" "$(uname -m)"
      - name: Re-verify released assets
        # codesign --verify --deep --strict on the mounted app is already part
        # of make dmg's packaging; do not re-mount here. Assert the per-arch
        # checksum in SHA256SUMS matches the actual DMG, latest.json is
        # non-empty, and THIS arch's entry is present and carries that sha
        # (T-02-01-04: the arm64 entry never carries the x86_64 url/sha).
        working-directory: app/ScanStudio
        run: |
          DMG=".build/ScanStudio-$RELEASE_VERSION-macOS-$(uname -m).dmg"
          EXPECTED="$(awk '{print $1}' .build/SHA256SUMS)"
          ACTUAL="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"
          test -s .build/latest.json
          python3 - "$(uname -m)" "$ACTUAL" <<'PY'
          import json, sys
          arch, actual = sys.argv[1:3]
          d = json.load(open(".build/latest.json"))
          entry = d["architectures"][arch]
          assert entry["sha256"] == actual
          assert d["architectures"][arch]["url"].endswith(".dmg")
          print(f"{arch} entry present and matches checksum {actual}")
          PY
          scripts/assert_no_web_runtime.sh .build/ScanStudio.app
          echo "Checksum re-verified: $ACTUAL"
      - name: Upload ${{ matrix.arch }} release assets
        uses: actions/upload-artifact@v4
        with:
          name: ScanStudio-dmg-${{ matrix.arch }}
          path: |
            app/ScanStudio/.build/ScanStudio-${{ env.RELEASE_VERSION }}-macOS-${{ matrix.arch }}.dmg
            app/ScanStudio/.build/SHA256SUMS
            app/ScanStudio/.build/latest.json
          if-no-files-found: error
          retention-days: 1

  web-runtime:
    name: Build signed/notarized web runtime (${{ matrix.arch }})
    # The optional runtime has a materially stronger trust requirement than
    # today's ad-hoc-signed main app. Merely pushing a tag never opts it in.
    # Once enabled, missing/invalid Developer ID, notarization, or Ed25519
    # credentials fail this job and the publish job refuses the whole release.
    if: vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME == 'true'
    strategy:
      fail-fast: true
      matrix:
        arch: [arm64, x86_64]
        include:
          - arch: arm64
            runs-on: macos-15
          - arch: x86_64
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require the canonical optional-runtime release repository
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "rohanpandula/ScanStudio" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ports/tauri/app/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Select and prove release cryptography and pinned Python tooling
        run: |
          set -euo pipefail
          brew install openssl@3 zstd
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          ports/web/packaging/macos/require-openssl3.sh "$openssl_bin"
          pbs_root="$RUNNER_TEMP/scanstudio-python-build-standalone"
          ports/web/packaging/macos/prepare-pinned-python.sh \
            "${{ matrix.arch }}" "$pbs_root"
          {
            echo "OPENSSL_BIN=$openssl_bin"
            echo "SCANSTUDIO_PBS_DISTRIBUTION_ROOT=$pbs_root"
            echo "UV_PYTHON=$pbs_root/install/bin/python3.13"
            echo "UV_PYTHON_DOWNLOADS=never"
          } >> "$GITHUB_ENV"
      - name: Resolve version and require the complete production trust set
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.SCANSTUDIO_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.SCANSTUDIO_DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.SCANSTUDIO_DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_TEAM: ${{ secrets.SCANSTUDIO_DEVELOPER_ID_TEAM }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.SCANSTUDIO_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.SCANSTUDIO_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.SCANSTUDIO_NOTARY_ISSUER_ID }}
          MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.SCANSTUDIO_WEB_MANIFEST_PRIVATE_KEY_BASE64 }}
          MANIFEST_KEY_ID: ${{ vars.SCANSTUDIO_WEB_MANIFEST_KEY_ID }}
        run: |
          set -euo pipefail
          for required in \
            DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD \
            DEVELOPER_ID_APPLICATION DEVELOPER_ID_TEAM \
            NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID \
            MANIFEST_PRIVATE_KEY_BASE64 MANIFEST_KEY_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Optional web runtime is enabled but $required is not configured." >&2
              exit 78
            fi
          done
          [[ "$DEVELOPER_ID_APPLICATION" == 'Developer ID Application: '* ]]
          [[ "$DEVELOPER_ID_TEAM" =~ ^[0-9A-Z]{10}$ ]]
          [[ "$MANIFEST_KEY_ID" =~ ^[0-9A-Za-z._-]{1,64}$ ]]

          version="${GITHUB_REF_NAME#v}"
          public_key="$GITHUB_WORKSPACE/ports/web/packaging/macos/manifest-keys/$MANIFEST_KEY_ID.pem"
          if [[ ! -f "$public_key" || -L "$public_key" ]]; then
            echo "Committed manifest public key is missing: $public_key" >&2
            exit 78
          fi

          credential_root="$RUNNER_TEMP/scanstudio-web-credentials"
          mkdir -m 700 "$credential_root"
          keychain=""
          cleanup_failed_setup() {
            status=$?
            if [[ "$status" != 0 ]]; then
              if [[ -n "$keychain" ]]; then
                security delete-keychain "$keychain" >/dev/null 2>&1 || true
              fi
              rm -rf -- "$credential_root"
            fi
            exit "$status"
          }
          trap cleanup_failed_setup EXIT
          p12="$credential_root/developer-id.p12"
          notary_key="$credential_root/notary-key.p8"
          manifest_private="$credential_root/manifest-private.pem"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | "$OPENSSL_BIN" base64 -d -A > "$p12"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | "$OPENSSL_BIN" base64 -d -A > "$notary_key"
          printf '%s' "$MANIFEST_PRIVATE_KEY_BASE64" | "$OPENSSL_BIN" base64 -d -A > "$manifest_private"
          chmod 600 "$p12" "$notary_key" "$manifest_private"

          keychain="$credential_root/release.keychain-db"
          keychain_password="$("$OPENSSL_BIN" rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" \
            | grep -F -- "$DEVELOPER_ID_APPLICATION" >/dev/null

          derived_public="$credential_root/derived-public.pem"
          "$OPENSSL_BIN" pkey -in "$manifest_private" -pubout -out "$derived_public"
          cmp \
            <("$OPENSSL_BIN" pkey -pubin -in "$public_key" -outform DER) \
            <("$OPENSSL_BIN" pkey -pubin -in "$derived_public" -outform DER)

          {
            echo "RELEASE_VERSION=$version"
            echo "WEB_RUNTIME_CREDENTIAL_ROOT=$credential_root"
            echo "WEB_RUNTIME_KEYCHAIN=$keychain"
            echo "WEB_RUNTIME_KEYCHAIN_PASSWORD=$keychain_password"
            echo "WEB_RUNTIME_CODESIGN_IDENTITY=$DEVELOPER_ID_APPLICATION"
            echo "WEB_RUNTIME_TEAM_ID=$DEVELOPER_ID_TEAM"
            echo "WEB_RUNTIME_NOTARY_KEY=$notary_key"
            echo "WEB_RUNTIME_MANIFEST_PRIVATE_KEY=$manifest_private"
            echo "WEB_RUNTIME_MANIFEST_PUBLIC_KEY=$public_key"
            echo "WEB_RUNTIME_OUTPUT=$RUNNER_TEMP/scanstudio-web-runtime-release"
          } >> "$GITHUB_ENV"
          trap - EXIT
      - name: Build the locked gateway and shared simulator frontend
        run: |
          set -euo pipefail
          (cd ports/tauri/app && npm ci && npm run build:web)
          (cd ports/web && uv sync --locked --python "$UV_PYTHON" --no-dev --no-install-project)
      - name: Package, notarize, manifest-sign, and re-verify the runtime
        env:
          NOTARY_KEY_ID: ${{ secrets.SCANSTUDIO_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.SCANSTUDIO_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$WEB_RUNTIME_OUTPUT"
          stem="ScanStudio-WebRuntime-$RELEASE_VERSION-macOS-${{ matrix.arch }}"
          dmg="$WEB_RUNTIME_OUTPUT/$stem.dmg"
          summary="$RUNNER_TEMP/$stem.payload.json"

          ports/web/packaging/macos/package-runtime.sh \
            "$RELEASE_VERSION" "${{ matrix.arch }}" \
            "$WEB_RUNTIME_OUTPUT" "$WEB_RUNTIME_CODESIGN_IDENTITY"
          xcrun notarytool submit "$dmg" \
            --key "$WEB_RUNTIME_NOTARY_KEY" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/$stem.notary.json"
          python3 - "$RUNNER_TEMP/$stem.notary.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          assert value.get("status") == "Accepted", value
          assert value.get("id"), value
          PY
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

          ports/web/packaging/macos/inspect-runtime-dmg.sh \
            "$dmg" "$RELEASE_VERSION" "${{ matrix.arch }}" \
            "$WEB_RUNTIME_TEAM_ID" "$summary"
          ports/web/packaging/macos/emit-integrity.sh \
            "$dmg" "$RELEASE_VERSION" "${{ matrix.arch }}" "$summary" \
            "$WEB_RUNTIME_MANIFEST_PRIVATE_KEY" \
            "$WEB_RUNTIME_MANIFEST_PUBLIC_KEY" \
            "$WEB_RUNTIME_OUTPUT"
          ports/web/packaging/macos/verify-runtime-release.sh \
            "$dmg" "$WEB_RUNTIME_OUTPUT/$stem.json" \
            "$WEB_RUNTIME_OUTPUT/$stem.json.sig" \
            "$WEB_RUNTIME_MANIFEST_PUBLIC_KEY" \
            "$RELEASE_VERSION" "${{ matrix.arch }}" "$WEB_RUNTIME_TEAM_ID"
          test "$(find "$WEB_RUNTIME_OUTPUT" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
      - name: Upload ${{ matrix.arch }} web runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: ScanStudio-web-runtime-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/scanstudio-web-runtime-release/ScanStudio-WebRuntime-${{ env.RELEASE_VERSION }}-macOS-${{ matrix.arch }}.dmg
            ${{ runner.temp }}/scanstudio-web-runtime-release/ScanStudio-WebRuntime-${{ env.RELEASE_VERSION }}-macOS-${{ matrix.arch }}.json
            ${{ runner.temp }}/scanstudio-web-runtime-release/ScanStudio-WebRuntime-${{ env.RELEASE_VERSION }}-macOS-${{ matrix.arch }}.json.sig
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -n "${WEB_RUNTIME_KEYCHAIN:-}" ]]; then
            security delete-keychain "$WEB_RUNTIME_KEYCHAIN" >/dev/null 2>&1 || true
          fi
          if [[ -n "${WEB_RUNTIME_CREDENTIAL_ROOT:-}" \
                && "$WEB_RUNTIME_CREDENTIAL_ROOT" == "$RUNNER_TEMP/scanstudio-web-credentials" ]]; then
            rm -rf -- "$WEB_RUNTIME_CREDENTIAL_ROOT"
          fi

  windows-resources:
    name: Assemble Windows offline resources
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ports/tauri/app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Rust dependency notice generator
        run: cargo install --locked --version 0.9.1 --features cli cargo-about
      - name: Assemble and verify the WSL2 resource bundle
        working-directory: ports/tauri
        env:
          HOST_PYTHON: python3
        run: |
          ./packaging/windows/assemble-staging.sh
          ./packaging/windows/verify-bundle.sh ./packaging/.staging/windows
          tar -C packaging/.staging -czf "$RUNNER_TEMP/windows-staging.tar.gz" windows
      - uses: actions/upload-artifact@v4
        with:
          name: ScanStudio-windows-staging
          path: ${{ runner.temp }}/windows-staging.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build and verify Windows x64 Preview
    needs: windows-resources
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ScanStudio-windows-staging
          path: ${{ runner.temp }}/windows-staging
      - name: Restore the exact verified resource tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ports/tauri/packaging/.staging | Out-Null
          tar -xzf "$env:RUNNER_TEMP/windows-staging/windows-staging.tar.gz" -C ports/tauri/packaging/.staging
          if ($LASTEXITCODE -ne 0) { throw "Could not restore Windows staging" }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ports/tauri/app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Resolve release version from the tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build, install, smoke-test, and re-extract both Windows packages
        shell: pwsh
        run: |
          ports/tauri/packaging/windows/build-and-verify.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -OutputDir "$env:RUNNER_TEMP/scanstudio-windows-release"
      - uses: actions/upload-artifact@v4
        with:
          name: ScanStudio-windows-x86_64-preview
          path: ${{ runner.temp }}/scanstudio-windows-release/*
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Build and verify Linux x64 Preview
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2 libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev librsvg2-dev \
            libsane-dev libssl-dev libusb-1.0-0 libwebkit2gtk-4.1-dev squashfs-tools \
            libxdo-dev patchelf pkg-config sane-utils wget
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ports/tauri/app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Rust dependency notice generator
        run: cargo install --locked --version 0.9.1 --features cli cargo-about
      - name: Resolve release version from the tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build, extract, smoke-test, and re-extract both Linux packages
        env:
          # linuxdeploy is itself an AppImage; running it needs FUSE, which the
          # ubuntu GitHub runners do not reliably provide. Extract-and-run
          # removes that dependency so the bundle is deterministic.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ports/tauri/packaging/linux/build-and-verify.sh \
            "$RELEASE_VERSION" \
            "$RUNNER_TEMP/scanstudio-linux-release"
      - uses: actions/upload-artifact@v4
        with:
          name: ScanStudio-linux-x86_64-preview
          path: ${{ runner.temp }}/scanstudio-linux-release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish combined Beta and Previews
    needs: [release, windows, linux, web-runtime]
    if: >-
      ${{
        always() &&
        needs.release.result == 'success' &&
        needs.windows.result == 'success' &&
        needs.linux.result == 'success' &&
        (
          needs.web-runtime.result == 'success' ||
          (needs.web-runtime.result == 'skipped' && vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME != 'true')
        )
      }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      WEB_RUNTIME_ENABLED: ${{ vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME == 'true' }}
      WEB_RUNTIME_KEY_ID: ${{ vars.SCANSTUDIO_WEB_MANIFEST_KEY_ID }}
      WEB_RUNTIME_TEAM_ID: ${{ secrets.SCANSTUDIO_DEVELOPER_ID_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the canonical optional-runtime release repository
        if: vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME == 'true'
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "rohanpandula/ScanStudio" ]]
      - name: Select and prove OpenSSL 3 for transferred runtime verification
        if: vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME == 'true'
        run: |
          set -euo pipefail
          brew install openssl@3
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          ports/web/packaging/macos/require-openssl3.sh "$openssl_bin"
          echo "OPENSSL_BIN=$openssl_bin" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ScanStudio-dmg-arm64
          path: ${{ runner.temp }}/arm64
      - uses: actions/download-artifact@v4
        with:
          name: ScanStudio-dmg-x86_64
          path: ${{ runner.temp }}/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: ScanStudio-windows-x86_64-preview
          path: ${{ runner.temp }}/windows
      - uses: actions/download-artifact@v4
        with:
          name: ScanStudio-linux-x86_64-preview
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@v4
        if: vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME == 'true'
        with:
          name: ScanStudio-web-runtime-arm64
          path: ${{ runner.temp }}/web-runtime-arm64
      - uses: actions/download-artifact@v4
        if: vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME == 'true'
        with:
          name: ScanStudio-web-runtime-x86_64
          path: ${{ runner.temp }}/web-runtime-x86_64
      - name: Resolve release version from the tag
        run: |
          STAMP="${GITHUB_REF_NAME#v}"
          {
            echo "RELEASE_VERSION=$STAMP"
            echo "SCANSTUDIO_RELEASE_VERSION=$STAMP"
            echo "RELEASE_ASSETS=$RUNNER_TEMP/release-assets"
            echo "RELEASE_METADATA=$RUNNER_TEMP/release-metadata"
            echo "WEB_RUNTIME_PUBLIC_KEY=$GITHUB_WORKSPACE/ports/web/packaging/macos/manifest-keys/$WEB_RUNTIME_KEY_ID.pem"
          } >> "$GITHUB_ENV"
          echo "Resolved release version: $STAMP"
      - name: Stage the exact enabled package set and generate metadata
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_ASSETS" "$RELEASE_METADATA"
          cp "$RUNNER_TEMP/arm64/ScanStudio-$RELEASE_VERSION-macOS-arm64.dmg" "$RELEASE_ASSETS/"
          cp "$RUNNER_TEMP/x86_64/ScanStudio-$RELEASE_VERSION-macOS-x86_64.dmg" "$RELEASE_ASSETS/"
          cp "$RUNNER_TEMP/windows/ScanStudio-$RELEASE_VERSION-Windows-x86_64-preview-setup.exe" "$RELEASE_ASSETS/"
          cp "$RUNNER_TEMP/windows/ScanStudio-$RELEASE_VERSION-Windows-x86_64-preview-portable.zip" "$RELEASE_ASSETS/"
          cp "$RUNNER_TEMP/linux/ScanStudio-$RELEASE_VERSION-Linux-x86_64-preview.AppImage" "$RELEASE_ASSETS/"
          cp "$RUNNER_TEMP/linux/ScanStudio-$RELEASE_VERSION-Linux-x86_64-preview-portable.tar.gz" "$RELEASE_ASSETS/"

          checksum_assets=(
            "ScanStudio-$RELEASE_VERSION-macOS-arm64.dmg"
            "ScanStudio-$RELEASE_VERSION-macOS-x86_64.dmg"
            "ScanStudio-$RELEASE_VERSION-Windows-x86_64-preview-setup.exe"
            "ScanStudio-$RELEASE_VERSION-Windows-x86_64-preview-portable.zip"
            "ScanStudio-$RELEASE_VERSION-Linux-x86_64-preview.AppImage"
            "ScanStudio-$RELEASE_VERSION-Linux-x86_64-preview-portable.tar.gz"
          )
          expected_count=6
          if [[ "$WEB_RUNTIME_ENABLED" == true ]]; then
            [[ "$WEB_RUNTIME_KEY_ID" =~ ^[0-9A-Za-z._-]{1,64}$ ]]
            [[ -f "$WEB_RUNTIME_PUBLIC_KEY" && ! -L "$WEB_RUNTIME_PUBLIC_KEY" ]]
            [[ "$WEB_RUNTIME_TEAM_ID" =~ ^[0-9A-Z]{10}$ ]]
            for runtime_arch in arm64 x86_64; do
              runtime_stem="ScanStudio-WebRuntime-$RELEASE_VERSION-macOS-$runtime_arch"
              runtime_source="$RUNNER_TEMP/web-runtime-$runtime_arch"
              for suffix in dmg json json.sig; do
                cp "$runtime_source/$runtime_stem.$suffix" "$RELEASE_ASSETS/"
                checksum_assets+=("$runtime_stem.$suffix")
              done
            done
            expected_count=12
          fi
          test "$(find "$RELEASE_ASSETS" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "$expected_count"

          app/ScanStudio/scripts/emit_release_assets.sh \
            "$RELEASE_ASSETS/ScanStudio-$RELEASE_VERSION-macOS-arm64.dmg" \
            "$RELEASE_VERSION" "$RELEASE_METADATA" arm64
          app/ScanStudio/scripts/emit_release_assets.sh \
            "$RELEASE_ASSETS/ScanStudio-$RELEASE_VERSION-macOS-x86_64.dmg" \
            "$RELEASE_VERSION" "$RELEASE_METADATA" x86_64

          (
            cd "$RELEASE_ASSETS"
            shasum -a 256 "${checksum_assets[@]}"
          ) > "$RELEASE_METADATA/SHA256SUMS"
      - name: Re-verify all local release assets
        run: |
          set -euo pipefail
          python3 - "$RELEASE_ASSETS" "$RELEASE_METADATA" "$RELEASE_VERSION" "$WEB_RUNTIME_ENABLED" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          assets = Path(sys.argv[1])
          metadata = Path(sys.argv[2])
          version = sys.argv[3]
          web_runtime_enabled = sys.argv[4].lower() == "true"
          expected = {
              f"ScanStudio-{version}-macOS-arm64.dmg",
              f"ScanStudio-{version}-macOS-x86_64.dmg",
              f"ScanStudio-{version}-Windows-x86_64-preview-setup.exe",
              f"ScanStudio-{version}-Windows-x86_64-preview-portable.zip",
              f"ScanStudio-{version}-Linux-x86_64-preview.AppImage",
              f"ScanStudio-{version}-Linux-x86_64-preview-portable.tar.gz",
          }
          if web_runtime_enabled:
              for arch in ("arm64", "x86_64"):
                  stem = f"ScanStudio-WebRuntime-{version}-macOS-{arch}"
                  expected.update({f"{stem}.dmg", f"{stem}.json", f"{stem}.json.sig"})
          actual = {path.name for path in assets.iterdir() if path.is_file()}
          assert actual == expected, (actual, expected)

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          ledger = {}
          for line in (metadata / "SHA256SUMS").read_text().splitlines():
              digest, name = line.split(None, 1)
              ledger[name] = digest
          assert set(ledger) == expected, ledger
          for name in expected:
              assert ledger[name] == sha256(assets / name), name

          latest = json.loads((metadata / "latest.json").read_text())
          assert latest["version"] == version
          assert set(latest["architectures"]) == {"arm64", "x86_64"}
          for arch in ("arm64", "x86_64"):
              name = f"ScanStudio-{version}-macOS-{arch}.dmg"
              entry = latest["architectures"][arch]
              assert entry["url"].endswith("/" + name)
              assert entry["sha256"] == ledger[name]
          print(f"exact {len(expected)}-asset package set, central checksums, and Mac-only updater pointer verified")
          PY
      - name: Re-verify optional signed runtime assets after artifact transfer
        if: vars.SCANSTUDIO_PUBLISH_WEB_RUNTIME == 'true'
        run: |
          set -euo pipefail
          for runtime_arch in arm64 x86_64; do
            stem="ScanStudio-WebRuntime-$RELEASE_VERSION-macOS-$runtime_arch"
            ports/web/packaging/macos/verify-runtime-release.sh \
              "$RELEASE_ASSETS/$stem.dmg" \
              "$RELEASE_ASSETS/$stem.json" \
              "$RELEASE_ASSETS/$stem.json.sig" \
              "$WEB_RUNTIME_PUBLIC_KEY" \
              "$RELEASE_VERSION" "$runtime_arch" "$WEB_RUNTIME_TEAM_ID"
          done
      - name: Write release notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ScanStudio $RELEASE_VERSION is one prerelease with four clearly separated support levels.

          - **macOS Apple Silicon: Beta.** The Nikon LS-5000 real-film workflow has been validated.
          - **macOS Intel: Preview.** Built and package-tested natively in CI; real-scanner validation is still pending.
          - **Windows x64: Preview.** The native installer is built, installed, and checked in CI. The portable archive's contents and engine sidecar are checked; it requires Microsoft Edge WebView2 to already be installed, so clean systems should use setup.exe. The bundled Python bridge and dependency wheelhouse install without PyPI access, but Ubuntu system prerequisites still require apt/network. Real-scanner validation is pending. Scanner access requires WSL2 with Ubuntu 24.04 and usbipd-win.
          - **Linux x64: Preview.** The AppImage and portable archive are built and package-verified on Ubuntu 22.04, including their contents, engine sidecar, bundled bridge launch/import, and python-sane imports. The Tauri GUI and real scanner have not been validated end to end. The host must provide compatible SANE/libusb runtime packages and scanner permissions.

          The main macOS app builds are ad-hoc signed and not notarized. The Windows installer is unsigned and may show a SmartScreen warning. The Linux packages are unsigned. Review SHA256SUMS before installing when downloading outside the GitHub Releases page.

          Choose the DMG matching your Mac. Windows users should use setup.exe on a clean system; the portable zip is for systems that already have WebView2. Linux users can choose the AppImage or extracted portable tarball.
          EOF
          if [[ "$WEB_RUNTIME_ENABLED" == true ]]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<EOF

          **Optional macOS browser runtime:** a separate simulator-only runtime is available for each Mac architecture. It is compatible only with ScanStudio $RELEASE_VERSION, reuses that installed app's engine, and contains no engine, scanner bridge, CoolScanPy, libusb, SANE binding, or hardware-motion authorization. Unlike the main app, this optional payload is Developer ID signed and notarized. ScanStudio authenticates its exact-version JSON manifest with a detached raw Ed25519 signature before download and re-verifies the installed payload tree before every launch.
          EOF
          fi
      - name: Create and verify a draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_files=(
            "$RELEASE_ASSETS/ScanStudio-$RELEASE_VERSION-macOS-arm64.dmg"
            "$RELEASE_ASSETS/ScanStudio-$RELEASE_VERSION-macOS-x86_64.dmg"
            "$RELEASE_ASSETS/ScanStudio-$RELEASE_VERSION-Windows-x86_64-preview-setup.exe"
            "$RELEASE_ASSETS/ScanStudio-$RELEASE_VERSION-Windows-x86_64-preview-portable.zip"
            "$RELEASE_ASSETS/ScanStudio-$RELEASE_VERSION-Linux-x86_64-preview.AppImage"
            "$RELEASE_ASSETS/ScanStudio-$RELEASE_VERSION-Linux-x86_64-preview-portable.tar.gz"
          )
          if [[ "$WEB_RUNTIME_ENABLED" == true ]]; then
            for runtime_arch in arm64 x86_64; do
              runtime_stem="ScanStudio-WebRuntime-$RELEASE_VERSION-macOS-$runtime_arch"
              release_files+=(
                "$RELEASE_ASSETS/$runtime_stem.dmg"
                "$RELEASE_ASSETS/$runtime_stem.json"
                "$RELEASE_ASSETS/$runtime_stem.json.sig"
              )
            done
          fi
          release_files+=("$RELEASE_METADATA/SHA256SUMS" "$RELEASE_METADATA/latest.json")
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --prerelease \
            --latest=false \
            --title "ScanStudio $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_files[@]}"
          # A draft release's tag is not attached until publish, so the
          # releases/tags/<tag> endpoint returns 404 for it. List releases and
          # match on tag_name, which IS populated on drafts.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq "first(.[] | select(.tag_name == \"$GITHUB_REF_NAME\"))" \
            > "$RUNNER_TEMP/draft-release.json"
          test -s "$RUNNER_TEMP/draft-release.json"
          python3 - "$RUNNER_TEMP/draft-release.json" "$RELEASE_ASSETS" "$RELEASE_METADATA" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          asset_dir, metadata_dir = map(Path, sys.argv[2:4])
          local = {path.name: path for path in asset_dir.iterdir() if path.is_file()}
          local.update({name: metadata_dir / name for name in ("SHA256SUMS", "latest.json")})
          remote = {item["name"]: item for item in payload["assets"]}
          assert payload["draft"] is True
          assert payload["prerelease"] is True
          assert set(remote) == set(local), (set(remote), set(local))
          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for name, path in local.items():
              digest = sha256(path)
              assert remote[name]["size"] == path.stat().st_size, name
              assert remote[name].get("digest") == f"sha256:{digest}", name
          print(f"draft release has exactly {len(local)} byte-verified assets")
          PY
      - name: Publish and re-verify the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/published-release.json"
          python3 - "$RUNNER_TEMP/published-release.json" "$RELEASE_ASSETS" "$RELEASE_METADATA" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          asset_dir, metadata_dir = map(Path, sys.argv[2:4])
          local = {path.name: path for path in asset_dir.iterdir() if path.is_file()}
          local.update({name: metadata_dir / name for name in ("SHA256SUMS", "latest.json")})
          remote = {item["name"]: item for item in payload["assets"]}
          assert payload["draft"] is False
          assert payload["prerelease"] is True
          assert set(remote) == set(local)
          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for name, path in local.items():
              digest = sha256(path)
              assert remote[name]["size"] == path.stat().st_size, name
              assert remote[name].get("digest") == f"sha256:{digest}", name
          print(payload["html_url"])
          print(f"published prerelease reverified with exactly {len(local)} assets")
          PY
      - name: Summarize published release
        run: |
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          cat "$RELEASE_METADATA/SHA256SUMS"
