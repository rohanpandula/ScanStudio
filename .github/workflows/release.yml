name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact tagged commit
    needs: authorize
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  authorize:
    name: Authorize tag from reviewed main history
    runs-on: ubuntu-22.04
    outputs:
      tag_object_sha: ${{ steps.remote-tag.outputs.tag_object_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch and pin the exact remote tag object
        id: remote-tag
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/verify_remote_release_tag.py \
            --tag "$GITHUB_REF_NAME" \
            --expected-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --stage authorize \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify tag commit, main containment, and full notes
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags --force origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          version="${GITHUB_REF_NAME#v}"
          python3 -I -S -B scripts/verify_release_notes.py \
            "docs/releases/$GITHUB_REF_NAME.md" "$GITHUB_REF_NAME" "$version"
          python3 -I -S -B scripts/verify_release_workflow.py

  release:
    name: Build and verify arm64 DMG
    timeout-minutes: 150
    needs: verify
    runs-on: macos-15
    env:
      # See the package job in ci.yml: the relocatable package requires uv's
      # standalone CPython, not the runner image's framework Python. This is
      # the same verified `make dmg` path used locally, so a release is only
      # publishable if the exact signed app passes the packaging verification.
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_CPYTHON_BUILD: "20260718"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: coolscanpy PyPI sync gate
        # Owner policy (2026-08-08): a release may not ship driver code that
        # standalone `pip install coolscanpy` users would not have -- version
        # skew between the two makes field reports for the same film
        # incomparable. Content is compared against the exact authenticated
        # pinned sdist (version strings are checked second; an unbumped version
        # with changed code is exactly the failure mode). Publish the matching
        # coolscanpy release from the canonical repo before tagging ScanStudio.
        run: bash scripts/check_coolscanpy_pypi_sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: '1.97.1'
      - name: Install exact uv and managed Python build toolchain
        run: |
          python3 -I -S -B scripts/install_pinned_uv_python.py \
            --install-root "$RUNNER_TEMP/scanstudio-uv-python"
      - name: Verify exact Rust toolchain
        run: python3 -I -S -B scripts/verify_pinned_rust.py
      - name: Install locked production bridge dependencies
        working-directory: bridge
        # package_app.sh compiles exact python-sane 2.9.2 separately against
        # the source-pinned, private SANE 1.4.0 link SDK.
        run: uv sync --locked --no-dev --no-install-package python-sane
      - name: Resolve release version from the tag
        # The workflow only runs on `v*` tag pushes, so the exact-match tag
        # is authoritative; fall back to GITHUB_REF_NAME minus the leading v.
        run: |
          STAMP="$({ git describe --tags --exact-match HEAD 2>/dev/null || echo "$GITHUB_REF_NAME"; } | sed 's/^v//')"
          echo "RELEASE_VERSION=$STAMP" >> "$GITHUB_ENV"
          echo "SCANSTUDIO_RELEASE_VERSION=$STAMP" >> "$GITHUB_ENV"
          echo "Resolved release version: $STAMP"
      - name: Import the Developer ID signing identity
        # A release build must be signed for distribution: this job fails
        # loudly when the signing secrets are absent rather than silently
        # shipping another ad-hoc build. The certificate lives only in a
        # throwaway keychain deleted in the always() cleanup below; the
        # identity string (not a secret) is exported for package_app.sh.
        env:
          P12_B64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          test -n "$P12_B64" || { echo "MACOS_SIGNING_CERT_P12_BASE64 secret is missing or empty"; exit 1; }
          test -n "$CERT_PW" || { echo "MACOS_SIGNING_CERT_PASSWORD secret is missing or empty"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/scanstudio-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S 'apple-tool:,apple:' -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY" || { echo "no Developer ID Application identity found in the imported certificate"; exit 1; }
          echo "SCANSTUDIO_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Imported signing identity: $IDENTITY"
      - name: Write the notarization API key
        env:
          NOTARY_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}
        run: |
          test -n "$NOTARY_KEY_P8" || { echo "APPSTORE_CONNECT_API_KEY_P8 secret is missing or empty"; exit 1; }
          NOTARY_KEY_FILE="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY_FILE"
          # The secret is the raw PEM text of the downloaded AuthKey .p8
          # (NOT base64-wrapped, unlike the p12 secret) -- fail here, with a
          # clear reason, rather than at the end of a 40-minute build.
          grep -q "BEGIN PRIVATE KEY" "$NOTARY_KEY_FILE" || { echo "APPSTORE_CONNECT_API_KEY_P8 does not look like a raw PEM .p8 key"; exit 1; }
          echo "NOTARY_KEY_FILE=$NOTARY_KEY_FILE" >> "$GITHUB_ENV"
      - name: Build, sign, and verify the app
        # package_app.sh signs to notarization requirements with the
        # identity exported above; test_packaged_bridge.sh then executes the
        # hardened-runtime bundle (bridge smoke on the signed app).
        working-directory: app/ScanStudio
        run: make package
      - name: Notarize and staple the app
        # The .app needs its own ticket: the in-app updater's
        # publisher-trust gate requires a stapled ticket on the INSTALLED
        # app, and an app copied out of a DMG does not inherit the DMG's
        # ticket (it also covers offline first launch).
        env:
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        working-directory: app/ScanStudio
        run: |
          test -n "$NOTARY_KEY_ID" || { echo "APPSTORE_CONNECT_API_KEY_ID secret is missing or empty"; exit 1; }
          test -n "$NOTARY_ISSUER_ID" || { echo "APPSTORE_CONNECT_API_ISSUER_ID secret is missing or empty"; exit 1; }
          zsh scripts/notarize_artifact.sh app .build/ScanStudio.app
      - name: Build and verify the local DMG
        # package_dmg.sh names the artifact ScanStudio-<version>-macOS-<arch>.dmg
        # (arch from uname -m, i.e. this runner's native arch) and refuses to
        # overwrite an existing artifact; it builds from the already
        # notarized-and-stapled app above.
        working-directory: app/ScanStudio
        run: ./scripts/package_dmg.sh
      - name: Notarize and staple the DMG
        # MUST run before SHA256SUMS/latest.json are emitted: stapling
        # mutates the DMG, so every published checksum has to be computed
        # from the stapled artifact.
        env:
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        working-directory: app/ScanStudio
        run: |
          zsh scripts/notarize_artifact.sh dmg ".build/ScanStudio-$RELEASE_VERSION-macOS-$(uname -m).dmg"
      - name: Emit SHA256SUMS and arch-keyed latest.json
        working-directory: app/ScanStudio
        run: |
          scripts/emit_release_assets.sh ".build/ScanStudio-$RELEASE_VERSION-macOS-$(uname -m).dmg" "$RELEASE_VERSION" ".build" "$(uname -m)"
      - name: Re-verify released assets
        # codesign --verify --deep --strict on the mounted app is already part
        # of make dmg's packaging; do not re-mount here. Assert the per-arch
        # checksum in SHA256SUMS matches the actual DMG, latest.json is
        # non-empty, and THIS arch's entry is present and carries that sha
        # (T-02-01-04: the arm64 entry never carries the x86_64 url/sha).
        working-directory: app/ScanStudio
        run: |
          DMG=".build/ScanStudio-$RELEASE_VERSION-macOS-$(uname -m).dmg"
          EXPECTED="$(awk '{print $1}' .build/SHA256SUMS)"
          ACTUAL="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"
          test -s .build/latest.json
          python3 - "$(uname -m)" "$ACTUAL" <<'PY'
          import json, sys
          arch, actual = sys.argv[1:3]
          d = json.load(open(".build/latest.json"))
          entry = d["architectures"][arch]
          assert entry["sha256"] == actual
          assert d["architectures"][arch]["url"].endswith(".dmg")
          print(f"{arch} entry present and matches checksum {actual}")
          PY
          echo "Checksum re-verified: $ACTUAL"
      - name: Bind Mac artifacts to this workflow run and commit
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/release_provenance.py emit \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --output "app/ScanStudio/.build/ScanStudio-macOS-arm64.provenance.json" \
            --artifact "app/ScanStudio/.build/ScanStudio-$RELEASE_VERSION-macOS-arm64.dmg" \
            --artifact app/ScanStudio/.build/SHA256SUMS \
            --artifact app/ScanStudio/.build/latest.json
      - name: Upload arm64 release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScanStudio-dmg-arm64
          path: |
            app/ScanStudio/.build/ScanStudio-${{ env.RELEASE_VERSION }}-macOS-arm64.dmg
            app/ScanStudio/.build/SHA256SUMS
            app/ScanStudio/.build/latest.json
            app/ScanStudio/.build/ScanStudio-macOS-arm64.provenance.json
          if-no-files-found: error
          retention-days: 1
      - name: Delete the throwaway signing keychain and key material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary-key.p8"
          KEYCHAIN="$RUNNER_TEMP/scanstudio-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security list-keychains -d user -s login.keychain-db
            security delete-keychain "$KEYCHAIN"
          fi

  verification-gate:
    name: Require every same-run release job to succeed
    if: ${{ always() }}
    needs:
      - verify
      - authorize
      - release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Reject failure cancellation timeout skip or missing result
        env:
          SCANSTUDIO_REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          test -n "$VERIFIED_SHA"
          test "$VERIFIED_SHA" = "$GITHUB_SHA"
          python3 -I -S -B scripts/verify_required_job_results.py

  publish:
    name: Publish Apple Silicon beta
    needs: [authorize, verify, verification-gate]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScanStudio-dmg-arm64
          path: ${{ runner.temp }}/arm64
      - name: Verify all exact-run artifact provenance
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/release_provenance.py verify \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --receipt "$RUNNER_TEMP/arm64/ScanStudio-macOS-arm64.provenance.json" \
            --artifact-root "$RUNNER_TEMP/arm64"
      - name: Resolve release version from the tag
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          test -n "$VERIFIED_SHA"
          test "$VERIFIED_SHA" = "$GITHUB_SHA"
          STAMP="${GITHUB_REF_NAME#v}"
          {
            echo "RELEASE_VERSION=$STAMP"
            echo "SCANSTUDIO_RELEASE_VERSION=$STAMP"
            echo "RELEASE_ASSETS=$RUNNER_TEMP/release-assets"
            echo "RELEASE_METADATA=$RUNNER_TEMP/release-metadata"
          } >> "$GITHUB_ENV"
          echo "Resolved release version: $STAMP"
      - name: Verify tag-bound full release notes
        run: |
          set -euo pipefail
          RELEASE_NOTES_PATH="$GITHUB_WORKSPACE/docs/releases/$GITHUB_REF_NAME.md"
          python3 -I -S -B scripts/verify_release_notes.py \
            "$RELEASE_NOTES_PATH" "$GITHUB_REF_NAME" "$RELEASE_VERSION"
          echo "RELEASE_NOTES=$RELEASE_NOTES_PATH" >> "$GITHUB_ENV"
      - name: Stage the Apple Silicon DMG and generate metadata
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_ASSETS" "$RELEASE_METADATA"
          cp "$RUNNER_TEMP/arm64/ScanStudio-$RELEASE_VERSION-macOS-arm64.dmg" "$RELEASE_ASSETS/"
          test "$(find "$RELEASE_ASSETS" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
          app/ScanStudio/scripts/emit_release_assets.sh \
            "$RELEASE_ASSETS/ScanStudio-$RELEASE_VERSION-macOS-arm64.dmg" \
            "$RELEASE_VERSION" "$RELEASE_METADATA" arm64
      - name: Re-verify all local release assets
        run: |
          set -euo pipefail
          python3 - "$RELEASE_ASSETS" "$RELEASE_METADATA" "$RELEASE_VERSION" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          assets = Path(sys.argv[1])
          metadata = Path(sys.argv[2])
          version = sys.argv[3]
          expected = {
              f"ScanStudio-{version}-macOS-arm64.dmg",
          }
          actual = {path.name for path in assets.iterdir() if path.is_file()}
          assert actual == expected, (actual, expected)

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          ledger = {}
          for line in (metadata / "SHA256SUMS").read_text().splitlines():
              digest, name = line.split(None, 1)
              ledger[name] = digest
          assert set(ledger) == expected, ledger
          for name in expected:
              assert ledger[name] == sha256(assets / name), name

          latest = json.loads((metadata / "latest.json").read_text())
          assert latest["version"] == version
          assert set(latest["architectures"]) == {"arm64"}
          for arch in ("arm64",):
              name = f"ScanStudio-{version}-macOS-{arch}.dmg"
              entry = latest["architectures"][arch]
              assert entry["url"].endswith("/" + name)
              assert entry["sha256"] == ledger[name]
          print("Apple Silicon DMG, checksum, and updater pointer verified")
          PY
      - name: Create and verify a draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZED_TAG_OBJECT: ${{ needs.authorize.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          test -n "$AUTHORIZED_TAG_OBJECT"
          python3 -I -S -B scripts/verify_remote_release_tag.py \
            --tag "$GITHUB_REF_NAME" \
            --expected-commit "$GITHUB_SHA" \
            --expected-object "$AUTHORIZED_TAG_OBJECT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --stage draft
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --prerelease \
            --latest=false \
            --title "ScanStudio $RELEASE_VERSION" \
            --notes-file "$RELEASE_NOTES" \
            "$RELEASE_ASSETS/ScanStudio-$RELEASE_VERSION-macOS-arm64.dmg" \
            "$RELEASE_METADATA/SHA256SUMS" \
            "$RELEASE_METADATA/latest.json"
          # A draft release's tag is not attached until publish, so the
          # releases/tags/<tag> endpoint returns 404 for it. List releases and
          # match on tag_name, which IS populated on drafts.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq "first(.[] | select(.tag_name == \"$GITHUB_REF_NAME\"))" \
            > "$RUNNER_TEMP/draft-release.json"
          test -s "$RUNNER_TEMP/draft-release.json"
          python3 - \
            "$RUNNER_TEMP/draft-release.json" \
            "$RELEASE_ASSETS" \
            "$RELEASE_METADATA" \
            "$RELEASE_NOTES" \
            "$GITHUB_REF_NAME" \
            "$RELEASE_VERSION" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          asset_dir, metadata_dir = map(Path, sys.argv[2:4])
          notes_path = Path(sys.argv[4])
          tag, version = sys.argv[5:7]
          local = {path.name: path for path in asset_dir.iterdir() if path.is_file()}
          local.update({name: metadata_dir / name for name in ("SHA256SUMS", "latest.json")})
          remote = {item["name"]: item for item in payload["assets"]}
          assert payload["draft"] is True
          assert payload["prerelease"] is True
          assert payload["tag_name"] == tag
          assert payload["name"] == f"ScanStudio {version}"
          assert payload["body"] == notes_path.read_text(encoding="utf-8")
          assert set(remote) == set(local), (set(remote), set(local))
          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for name, path in local.items():
              digest = sha256(path)
              assert remote[name]["size"] == path.stat().st_size, name
              assert remote[name].get("digest") == f"sha256:{digest}", name
          print("draft release has exact tag-bound notes and three byte-verified assets")
          PY
      - name: Publish and re-verify the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZED_TAG_OBJECT: ${{ needs.authorize.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          test -n "$AUTHORIZED_TAG_OBJECT"
          python3 -I -S -B scripts/verify_remote_release_tag.py \
            --tag "$GITHUB_REF_NAME" \
            --expected-commit "$GITHUB_SHA" \
            --expected-object "$AUTHORIZED_TAG_OBJECT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --stage publication
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false \
            --notes-file "$RELEASE_NOTES"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/published-release.json"
          python3 - \
            "$RUNNER_TEMP/published-release.json" \
            "$RELEASE_ASSETS" \
            "$RELEASE_METADATA" \
            "$RELEASE_NOTES" \
            "$GITHUB_REF_NAME" \
            "$RELEASE_VERSION" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          asset_dir, metadata_dir = map(Path, sys.argv[2:4])
          notes_path = Path(sys.argv[4])
          tag, version = sys.argv[5:7]
          local = {path.name: path for path in asset_dir.iterdir() if path.is_file()}
          local.update({name: metadata_dir / name for name in ("SHA256SUMS", "latest.json")})
          remote = {item["name"]: item for item in payload["assets"]}
          assert payload["draft"] is False
          assert payload["prerelease"] is True
          assert payload["tag_name"] == tag
          assert payload["name"] == f"ScanStudio {version}"
          assert payload["body"] == notes_path.read_text(encoding="utf-8")
          assert set(remote) == set(local)
          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for name, path in local.items():
              digest = sha256(path)
              assert remote[name]["size"] == path.stat().st_size, name
              assert remote[name].get("digest") == f"sha256:{digest}", name
          print(payload["html_url"])
          print("published prerelease reverified with exact tag-bound notes and three assets")
          PY
      - name: Summarize published release
        run: |
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          cat "$RELEASE_METADATA/SHA256SUMS"
