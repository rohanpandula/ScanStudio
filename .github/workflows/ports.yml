name: Cross-platform port

on:
  push:
    branches: ['main']
    paths:
      - 'ports/tauri/**'
      - '.github/workflows/ports.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'ports/tauri/**'
      - '.github/workflows/ports.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: ports-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-resources:
    name: Assemble Windows offline resources
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_CPYTHON_BUILD: "20260718"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install exact Node and Python build toolchains
        run: |
          python3 -I -S -B scripts/install_pinned_node.py \
            --install-root "$RUNNER_TEMP/scanstudio-node"
          python3 -I -S -B scripts/install_pinned_uv_python.py \
            --install-root "$RUNNER_TEMP/scanstudio-uv-python"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: '1.97.1'
      - name: Verify exact Rust toolchain
        run: python3 -I -S -B scripts/verify_pinned_rust.py
      - name: Install authenticated Rust dependency notice generator
        run: |
          python3 -I -S -B scripts/install_pinned_cargo_about.py \
            --install-root "$RUNNER_TEMP/scanstudio-cargo-about"
      - name: Stamp the CI version before assembling Windows resources
        # Must run BEFORE assemble-staging.sh, which byte-copies Cargo.lock
        # and package.json/package-lock.json into the staged Licenses/ tree
        # from this checkout. Uses the exact same "0.3.0-ci.<run_number>"
        # version the `windows` job below already passes to
        # build-and-verify.ps1, so the staged license snapshot and the built
        # binary's self-reported version agree (mirrors the release.yml fix
        # for this same job).
        working-directory: ports/tauri
        run: |
          python3 -I -S -B packaging/stamp_release_version.py \
            app/src-tauri/tauri.conf.json \
            app/package.json \
            app/src-tauri/Cargo.toml \
            app/src-tauri/Cargo.lock \
            "0.3.0-ci.${{ github.run_number }}"
      - name: Assemble and verify the WSL2 resource bundle
        working-directory: ports/tauri
        env:
          HOST_PYTHON: python3
        run: |
          ./packaging/windows/tests/test-hardware-session-launcher.sh
          ./packaging/windows/assemble-staging.sh
          ./packaging/windows/verify-bundle.sh ./packaging/.staging/windows
          tar -C packaging/.staging -czf "$RUNNER_TEMP/windows-staging.tar.gz" windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: port-windows-staging
          path: ${{ runner.temp }}/windows-staging.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build and verify Windows x64 Preview
    needs: windows-resources
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_CPYTHON_BUILD: "20260718"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: port-windows-staging
          path: ${{ runner.temp }}/windows-staging
      - name: Restore the exact verified resource tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ports/tauri/packaging/.staging | Out-Null
          tar -xzf "$env:RUNNER_TEMP/windows-staging/windows-staging.tar.gz" -C ports/tauri/packaging/.staging
          if ($LASTEXITCODE -ne 0) { throw "Could not restore Windows staging" }
      - name: Install exact Node and Python build toolchains
        shell: pwsh
        run: |
          python -I -S -B scripts/install_pinned_node.py `
            --install-root "$env:RUNNER_TEMP\scanstudio-node"
          if ($LASTEXITCODE -ne 0) { throw "Pinned Node installation failed" }
          python -I -S -B scripts/install_pinned_uv_python.py `
            --install-root "$env:RUNNER_TEMP\scanstudio-uv-python"
          if ($LASTEXITCODE -ne 0) { throw "Pinned uv/Python installation failed" }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: '1.97.1'
      - name: Verify exact Rust toolchain
        run: python -I -S -B scripts/verify_pinned_rust.py
      - name: Build, install, smoke-test, and re-extract both Windows packages
        shell: pwsh
        run: |
          ports/tauri/packaging/windows/build-and-verify.ps1 `
            -Version "0.3.0-ci.${{ github.run_number }}" `
            -OutputDir "$env:RUNNER_TEMP/scanstudio-windows-preview"

  linux:
    name: Build and verify Linux x64 Preview
    runs-on: ubuntu-22.04
    container: ubuntu@sha256:0199853f6d6b20b0424f3c5694a72a62764f01e6a771b1eb48a4197848986c7e
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_CPYTHON_BUILD: "20260718"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Linux build and runtime prerequisites
        run: scripts/install_ubuntu_build_prerequisites.sh
      - name: Install exact Node and Python build toolchains
        run: |
          python3 -I -S -B scripts/install_pinned_node.py \
            --install-root "$RUNNER_TEMP/scanstudio-node"
          python3 -I -S -B scripts/install_pinned_uv_python.py \
            --install-root "$RUNNER_TEMP/scanstudio-uv-python"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: '1.97.1'
      - name: Verify exact Rust toolchain
        run: python3 -I -S -B scripts/verify_pinned_rust.py
      - name: Install authenticated Rust dependency notice generator
        run: |
          python3 -I -S -B scripts/install_pinned_cargo_about.py \
            --install-root "$RUNNER_TEMP/scanstudio-cargo-about"
      - name: Build, extract, smoke-test, and re-extract both Linux packages
        env:
          # linuxdeploy is itself an AppImage; running it needs FUSE, which the
          # ubuntu GitHub runners do not reliably provide. Extracting and
          # running it instead removes that dependency so the AppImage bundle
          # is deterministic (runner-env fix).
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ports/tauri/packaging/linux/build-and-verify.sh \
            "0.3.0-ci.${{ github.run_number }}" \
            "$RUNNER_TEMP/scanstudio-linux-preview"
