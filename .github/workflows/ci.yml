name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

# Every push runs the full macOS matrix, so a quickly-superseded commit leaves
# an obsolete run holding runners ahead of the one that matters. Mirrors
# ports.yml. Release deliberately keeps cancel-in-progress: false -- a tagged
# build must never be interrupted -- but nothing consumes a Verify run via
# workflow_run, so cancelling a superseded one here is safe.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-review-tooling:
    name: Adversarial review tooling
    runs-on: ubuntu-latest
    env:
      OPENSSL_BIN: /usr/bin/openssl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Test deterministic shard and OpenCode parsers
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_github_action_pins.py
          python3 -m py_compile \
            scripts/adversarial_review_input.py \
            scripts/check_github_action_pins.py \
            scripts/check_adversarial_review.py \
            scripts/parse_opencode_review.py \
            ports/web/packaging/macos/runtime-assembly-receipt.py
          bash -n scripts/run_adversarial_review.sh
          bash -n \
            ports/web/packaging/macos/package-runtime.sh \
            ports/web/packaging/macos/assert-no-private-paths.sh \
            ports/web/packaging/macos/inspect-runtime-dmg.sh \
            ports/web/packaging/macos/sign-runtime.sh \
            ports/web/packaging/macos/payload-tree-hash.sh \
            ports/web/packaging/macos/prepare-pinned-python.sh \
            ports/web/packaging/macos/prepare-pinned-openssl.sh \
            ports/web/packaging/macos/require-openssl3.sh \
            ports/web/packaging/macos/emit-integrity.sh \
            ports/web/packaging/macos/verify-integrity.sh \
            ports/web/packaging/macos/verify-runtime-release.sh
          ports/web/packaging/macos/tests/test-integrity.sh
          ports/web/packaging/macos/tests/test-release-boundary.sh
          ports/web/packaging/macos/tests/test-payload-tree-hash.sh
          ports/web/packaging/macos/tests/test-python-build-standalone-evidence.sh

  adversarial-review:
    name: Adversarial review evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the reviewed diff and evidence reports
        run: >-
          python3 scripts/check_adversarial_review.py
          --expected-base "${{ github.event.pull_request.base.sha }}"
          --expected-tip "${{ github.event.pull_request.head.sha }}"

  app-and-engine:
    name: App and engine tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Select and prove OpenSSL 3 for packaging tests
        run: |
          brew install openssl@3
          OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          test "$OPENSSL_BIN" = "$(cd "$(dirname "$OPENSSL_BIN")" && pwd)/$(basename "$OPENSSL_BIN")"
          ports/web/packaging/macos/require-openssl3.sh "$OPENSSL_BIN"
          echo "OPENSSL_BIN=$OPENSSL_BIN" >> "$GITHUB_ENV"
      - name: Test Swift app and Rust engine
        working-directory: app/ScanStudio
        run: |
          scripts/tests/test_assert_no_web_runtime.sh
          scripts/tests/test_stamp_web_runtime_trust.sh
          xcrun clang -Os -Wall -Wextra -Werror -fsyntax-only \
            ../../ports/web/packaging/macos/launcher.c
          make test

  bridge:
    name: Bridge tests
    runs-on: macos-15
    # only-managed keeps uv off the runner image's python.org framework
    # build: the packaged bridge runtime relies on uv's standalone CPython
    # (@executable_path linkage), and using the same interpreter family in
    # every job keeps test and package environments interchangeable.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - name: Install bridge dependencies
        working-directory: bridge
        run: uv sync --locked
      - name: Test bridge
        working-directory: bridge
        run: uv run pytest

  coolscanpy:
    name: CoolscanPy tests
    runs-on: macos-15
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - name: Test direct-USB library and packaging logic
        working-directory: coolscanpy
        run: uv run pytest

  ports-vendor-sync:
    name: ports/tauri/vendor mirror drift check
    # Pure diff -rq against a checked-in allowlist -- no build, no deps, no
    # macOS runner needed. See scripts/check_ports_vendor_sync.sh's header
    # for what this does and does not guarantee.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check ports/tauri/vendor mirrors for drift beyond the known baseline
        run: scripts/check_ports_vendor_sync.sh

  web-preview:
    name: Browser gateway and container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ports/tauri/app/package-lock.json
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.13'
      - name: Test and build the shared browser client
        working-directory: ports/tauri/app
        run: |
          npm ci
          npm test
          npm run build:web
      - name: Test the locked simulator-only gateway
        working-directory: ports/web
        run: |
          uv sync --locked --extra test
          uv run ruff check .
          uv run pytest
      - name: Validate the hardened Compose contract
        env:
          SCANSTUDIO_WEB_TOKEN: ci-only-token
          SCANSTUDIO_WEB_ALLOWED_ORIGINS: http://127.0.0.1:8787
        run: |
          docker compose -f ports/web/compose.yaml config --quiet
          docker compose -f ports/web/compose.yaml config --format json \
            | python3 -c \
              'import json,sys; ports=json.load(sys.stdin)["services"]["scanstudio-web"]["ports"]; assert ports[0]["host_ip"] == "127.0.0.1", ports'
          SCANSTUDIO_WEB_PUBLISH_HOST=192.168.50.10 \
            docker compose -f ports/web/compose.yaml config --format json \
            | python3 -c \
              'import json,sys; ports=json.load(sys.stdin)["services"]["scanstudio-web"]["ports"]; assert ports[0]["host_ip"] == "192.168.50.10", ports'
          env -u SCANSTUDIO_WEB_COOKIE_SECURE \
            SCANSTUDIO_WEB_ALLOWED_ORIGINS=https://scanner.example.test \
            docker compose -f ports/web/compose.yaml config --format json \
            | python3 -c \
              'import json,sys; env=json.load(sys.stdin)["services"]["scanstudio-web"]["environment"]; assert env.get("SCANSTUDIO_WEB_COOKIE_SECURE") is None, env'
          SCANSTUDIO_WEB_COOKIE_SECURE=true \
            SCANSTUDIO_WEB_ALLOWED_ORIGINS=https://scanner.example.test \
            docker compose -f ports/web/compose.yaml config --format json \
            | python3 -c \
              'import json,sys; env=json.load(sys.stdin)["services"]["scanstudio-web"]["environment"]; assert env["SCANSTUDIO_WEB_COOKIE_SECURE"] == "true", env'
      - name: Build the simulator appliance image
        run: docker build -f ports/web/Dockerfile -t scanstudio-web:ci .
      - name: Smoke-test the built image with the real Rust simulator
        env:
          SCANSTUDIO_WEB_TOKEN: ci-only-token
          SCANSTUDIO_WEB_ALLOWED_ORIGINS: http://127.0.0.1:18787
        run: |
          cookie_jar="$(mktemp)"
          websocket_ready="$(mktemp)"
          websocket_event="$(mktemp)"
          websocket_pid=""
          cleanup() {
            if [[ -n "$websocket_pid" ]]; then
              kill "$websocket_pid" >/dev/null 2>&1 || true
            fi
            docker logs scanstudio-web-ci-smoke 2>/dev/null || true
            docker rm --force scanstudio-web-ci-smoke >/dev/null 2>&1 || true
            rm -f "$cookie_jar" "$websocket_ready" "$websocket_event"
          }
          trap cleanup EXIT

          docker run --detach --name scanstudio-web-ci-smoke \
            --init \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18787:8787 \
            --env SCANSTUDIO_WEB_BIND=0.0.0.0 \
            --env SCANSTUDIO_WEB_PORT=8787 \
            --env SCANSTUDIO_WEB_TOKEN \
            --env SCANSTUDIO_WEB_ALLOWED_ORIGINS \
            scanstudio-web:ci

          for ((attempt = 1; attempt <= 30; attempt += 1)); do
            if curl --fail --silent http://127.0.0.1:18787/startupz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18787/startupz >/dev/null
          curl --fail --silent http://127.0.0.1:18787/ | grep --quiet '#141618'

          curl --fail --silent \
            --cookie-jar "$cookie_jar" \
            --header 'Origin: http://127.0.0.1:18787' \
            --header 'Content-Type: application/json' \
            --data '{"token":"ci-only-token"}' \
            http://127.0.0.1:18787/api/v1/session/login >/dev/null
          wrong_origin_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie "$cookie_jar" \
            --header 'Origin: http://attacker.invalid' \
            --request POST \
            http://127.0.0.1:18787/api/v1/control/claim)"
          [[ "$wrong_origin_status" == 403 ]]
          lease="$(curl --fail --silent \
            --cookie "$cookie_jar" \
            --header 'Origin: http://127.0.0.1:18787' \
            --request POST \
            http://127.0.0.1:18787/api/v1/control/claim \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["leaseToken"])')"
          second_claim_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie "$cookie_jar" \
            --header 'Origin: http://127.0.0.1:18787' \
            --request POST \
            http://127.0.0.1:18787/api/v1/control/claim)"
          [[ "$second_claim_status" == 409 ]]
          missing_lease_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie "$cookie_jar" \
            --header 'Origin: http://127.0.0.1:18787' \
            --header 'Content-Type: application/json' \
            --data '{"method":"scanner.connect","params":{"deviceId":"sim-ls5000-0"}}' \
            http://127.0.0.1:18787/api/v1/engine/request)"
          [[ "$missing_lease_status" == 423 ]]

          request_engine() {
            curl --fail --silent \
              --cookie "$cookie_jar" \
              --header 'Origin: http://127.0.0.1:18787' \
              --header "X-ScanStudio-Control-Lease: $lease" \
              --header 'Content-Type: application/json' \
              --data "$1" \
              http://127.0.0.1:18787/api/v1/engine/request
          }
          session_cookie="$(awk '$6 == "scanstudio_session" { print $6 "=" $7 }' "$cookie_jar")"
          [[ -n "$session_cookie" ]]
          python3 - "$session_cookie" "$websocket_ready" "$websocket_event" <<'PY' &
          import base64
          import hashlib
          import json
          from pathlib import Path
          import os
          import socket
          import struct
          import sys

          cookie, ready_path, event_path = sys.argv[1:]
          ready = Path(ready_path)
          event = Path(event_path)
          key = base64.b64encode(os.urandom(16)).decode("ascii")
          expected_accept = base64.b64encode(
              hashlib.sha1(
                  (key + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11").encode("ascii")
              ).digest()
          ).decode("ascii")

          def receive_exact(connection: socket.socket, size: int) -> bytes:
              chunks = bytearray()
              while len(chunks) < size:
                  chunk = connection.recv(size - len(chunks))
                  if not chunk:
                      raise RuntimeError("WebSocket closed before the event arrived")
                  chunks.extend(chunk)
              return bytes(chunks)

          with socket.create_connection(("127.0.0.1", 18787), timeout=20) as connection:
              connection.settimeout(20)
              request = (
                  "GET /api/v1/engine/events HTTP/1.1\r\n"
                  "Host: 127.0.0.1:18787\r\n"
                  "Upgrade: websocket\r\n"
                  "Connection: Upgrade\r\n"
                  f"Sec-WebSocket-Key: {key}\r\n"
                  "Sec-WebSocket-Version: 13\r\n"
                  "Origin: http://127.0.0.1:18787\r\n"
                  f"Cookie: {cookie}\r\n\r\n"
              )
              connection.sendall(request.encode("ascii"))
              response = bytearray()
              while b"\r\n\r\n" not in response:
                  response.extend(connection.recv(4096))
                  if len(response) > 16_384:
                      raise RuntimeError("oversized WebSocket handshake response")
              header_block, buffered = bytes(response).split(b"\r\n\r\n", 1)
              lines = header_block.decode("ascii").split("\r\n")
              if lines[0] != "HTTP/1.1 101 Switching Protocols":
                  raise RuntimeError(f"WebSocket upgrade failed: {lines[0]}")
              headers = {
                  name.strip().lower(): value.strip()
                  for name, value in (line.split(":", 1) for line in lines[1:])
              }
              if headers.get("sec-websocket-accept") != expected_accept:
                  raise RuntimeError("WebSocket accept proof does not match")
              if buffered:
                  raise RuntimeError("unexpected event before smoke trigger")
              ready.write_text("ready\n", encoding="utf-8")

              first, second = receive_exact(connection, 2)
              if first != 0x81 or second & 0x80:
                  raise RuntimeError("expected one final, unmasked WebSocket text frame")
              size = second & 0x7F
              if size == 126:
                  size = struct.unpack("!H", receive_exact(connection, 2))[0]
              elif size == 127:
                  size = struct.unpack("!Q", receive_exact(connection, 8))[0]
              payload = receive_exact(connection, size)
              message = json.loads(payload.decode("utf-8"))
              if message.get("event") != "scanner.status":
                  raise RuntimeError(f"unexpected WebSocket event: {message!r}")
              event.write_text(json.dumps(message, sort_keys=True), encoding="utf-8")
          PY
          websocket_pid="$!"
          for ((attempt = 1; attempt <= 100; attempt += 1)); do
            if [[ -s "$websocket_ready" ]]; then
              break
            fi
            kill -0 "$websocket_pid"
            sleep 0.1
          done
          [[ -s "$websocket_ready" ]]
          request_engine '{"method":"scanner.connect","params":{"deviceId":"sim-ls5000-0","options":{"timeScale":0.01}}}' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"]["status"]["connected"] is True'
          wait "$websocket_pid"
          websocket_pid=""
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["event"] == "scanner.status"' \
            "$websocket_event"
          request_engine '{"method":"sim.loadMedia","params":{"carrier":"strip6"}}' >/dev/null
          request_engine '{"method":"scanner.acquireThumbnails","params":{"frames":[1],"operationId":"ci-preview"}}' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"]["accepted"] is True'
          preview_complete=false
          preview_deadline=$((SECONDS + 60))
          while ((SECONDS < preview_deadline)); do
            if request_engine '{"method":"scanner.status","params":{}}' \
                | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"]["transport"] == "idle"'; then
              preview_complete=true
              break
            fi
            sleep 0.25
          done
          [[ "$preview_complete" == true ]]
          request_engine '{"method":"scanner.disconnect","params":{}}' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"] == {}'
          request_engine '{"method":"scanner.status","params":{}}' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["error"]["code"] == "NOT_CONNECTED"'

  package:
    name: Self-contained package build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    # See the bridge job: the relocatable package requires uv's standalone
    # CPython, not the runner image's framework Python.
    #
    # Why package runs on BOTH archs while app-and-engine / bridge / coolscanpy
    # stay single-arch: those suites are arch-independent logic + tests, and a
    # full double run doubles billing for no extra coverage. The package gate
    # is the arch-relevant one -- it proves the bundled app + libusb + CPython
    # wheels build and pass the relocation-safe bridge check natively on arm64
    # AND x86_64 on every PR, mirroring the release matrix before a tag exists.
    #
    # Only the arm64 leg uploads the ScanStudio-app artifact: package-macos-14
    # (the OS-floor gate) and updater-integration consume that one arm64 app,
    # and two matrix legs must not race on the same artifact name. The x86_64
    # leg still builds + verifies natively; it just has no downstream consumer
    # yet.
    strategy:
      fail-fast: true
      matrix:
        arch: [arm64, x86_64]
        include:
          - arch: arm64
            runs-on: macos-15
            upload-artifact: true
          # GitHub-hosted Intel labels change over time; per the GitHub-hosted
          # runners reference the current standard is `macos-15-intel`. Kept in
          # lockstep with the release.yml matrix -- if it stops resolving, the
          # conservative fallback is `macos-13`; update BOTH files together.
          - arch: x86_64
            runs-on: macos-15-intel
            upload-artifact: false
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - name: Install optional SANE binding build prerequisite
        # The release does not copy Homebrew's libusb: package_app.sh builds
        # the signed app-owned copy from hash-pinned source at the declared
        # deployment target. sane-backends is needed only to compile the
        # optional python-sane compatibility binding included in the bundle.
        run: brew install sane-backends
      - name: Point the compiler at Homebrew's headers and libraries
        # GitHub Actions does not expand $(...) inside an `env:` block, and
        # Homebrew's prefix varies by runner architecture (/opt/homebrew on
        # Apple silicon, /usr/local on Intel), so resolve it here and export
        # it through GITHUB_ENV for every later step in this job -- python-sane
        # needs sane.h to build its C extension against.
        run: |
          echo "CPPFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Install locked bridge dependencies (with scanner extra)
        working-directory: bridge
        run: uv sync --locked --extra scanner
      - name: Build and verify the local package
        # make package runs package_app.sh then test_packaged_bridge.sh on the
        # built ScanStudio.app -- the relocation-safe bridge check -- so this
        # leg proves the packaged app works on this runner's native arch.
        working-directory: app/ScanStudio
        run: make package
      - name: Preserve the exact signed app for the macOS 14 runtime gate
        if: ${{ matrix.upload-artifact }}
        working-directory: app/ScanStudio/.build
        run: ditto -c -k --sequesterRsrc --keepParent ScanStudio.app ScanStudio-app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ matrix.upload-artifact }}
        with:
          name: ScanStudio-app
          path: app/ScanStudio/.build/ScanStudio-app.zip
          if-no-files-found: error
          retention-days: 1

  package-macos-14:
    name: Self-contained package check (macOS 14 floor)
    # Swift 6 is not available in the macOS 14 runner's Xcode. Build and sign
    # once in the package job, then execute that exact arm64 app on the oldest
    # supported OS. The relocated package check loads the app-owned libusb and
    # exercises the bundled launchers without enumerating or moving hardware.
    runs-on: macos-14
    needs: package
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - name: Warm the locked dependency cache for offline source verification
        working-directory: bridge
        run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScanStudio-app
          path: ${{ runner.temp }}/scanstudio-package
      - name: Unpack and verify the exact signed app on macOS 14
        run: |
          ditto -x -k "$RUNNER_TEMP/scanstudio-package/ScanStudio-app.zip" "$RUNNER_TEMP/scanstudio-package/unpacked"
          app/ScanStudio/scripts/test_packaged_bridge.sh "$RUNNER_TEMP/scanstudio-package/unpacked/ScanStudio.app"

  updater-integration:
    name: Updater integration gate
    # Reuses the exact signed app produced by the package job so the "release"
    # under test is the shipped artifact, not a dev build. Same-workflow job
    # ordering means the artifact is still present when this job runs, so the
    # package job's 1-day retention needs no bump.
    runs-on: macos-15
    needs: package
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - name: Warm the locked dependency cache
        # Keeps the runner environment interchangeable with the other uv-managed
        # jobs (see the bridge job note) so script behaviour is reproducible.
        working-directory: bridge
        run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScanStudio-app
          path: ${{ runner.temp }}/scanstudio-updater
      - name: Unpack the packaged app for the updater gate
        run: |
          ditto -x -k "$RUNNER_TEMP/scanstudio-updater/ScanStudio-app.zip" "$RUNNER_TEMP/scanstudio-updater/unpacked"
      - name: Run the seeded updater verification against the exact packaged app
        # Both point at the same real app: the script seeds its feed from the
        # new-app bytes and the harness proves resolve -> download -> verify ->
        # snapshot -> swap -> rollback on its own synthetic old/new fixtures, so
        # the flow's hash + swap still prove out against the signed artifact.
        env:
          SCANSTUDIO_UPDATER_CURRENT_APP: ${{ runner.temp }}/scanstudio-updater/unpacked/ScanStudio.app
          SCANSTUDIO_UPDATER_NEW_APP: ${{ runner.temp }}/scanstudio-updater/unpacked/ScanStudio.app
        run: |
          scripts/verify_updater.sh 2>&1 | tee "$RUNNER_TEMP/verify_updater.log"
          grep -q "VERIFY_UPDATER OK" "$RUNNER_TEMP/verify_updater.log"
