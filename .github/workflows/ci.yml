name: Verify

on:
  push:
    branches: [main]
  pull_request:
  # ScanStudio #104: the Release workflow invokes this workflow directly for
  # the exact tagged commit, making the full verification set a direct,
  # same-run dependency of every release build instead of a side-channel run
  # that could silently disagree with what was published.
  workflow_call:
    outputs:
      verified_sha:
        description: Exact commit that passed every required verification family
        value: ${{ jobs.verification-gate.outputs.verified_sha }}

permissions:
  contents: read

# Superseded branch verification may be cancelled; tagged release builds finish.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-and-engine:
    name: App and engine tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: '1.97.1'
      - name: Verify exact Rust toolchain
        run: python3 -I -S -B scripts/verify_pinned_rust.py
      - name: Test Swift app and Rust engine
        working-directory: app/ScanStudio
        run: make test
      - name: Test Apple Silicon packaging policy
        run: python3 -I -S -B -m unittest discover -s app/ScanStudio/scripts/tests -p 'test_*.py'

  bridge:
    name: Bridge tests
    runs-on: macos-15
    # only-managed keeps uv off the runner image's python.org framework
    # build: the packaged bridge runtime relies on uv's standalone CPython
    # (@executable_path linkage), and using the same interpreter family in
    # every job keeps test and package environments interchangeable.
    env:
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_CPYTHON_BUILD: "20260718"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install exact uv and managed Python build toolchain
        run: |
          python3 -I -S -B scripts/install_pinned_uv_python.py \
            --install-root "$RUNNER_TEMP/scanstudio-uv-python"
      - name: Install bridge dependencies
        working-directory: bridge
        run: uv sync --locked
      - name: Test bridge
        working-directory: bridge
        run: uv run pytest

  coolscanpy:
    name: CoolscanPy tests
    runs-on: macos-15
    env:
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_CPYTHON_BUILD: "20260718"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install exact uv and managed Python build toolchain
        run: |
          python3 -I -S -B scripts/install_pinned_uv_python.py \
            --install-root "$RUNNER_TEMP/scanstudio-uv-python"
      - name: Test direct-USB library and packaging logic
        working-directory: coolscanpy
        run: uv run pytest

  supply-chain-policy:
    name: Supply-chain policy checks
    # Stdlib-only policy checks do not need a macOS runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Enforce immutable GitHub Action references
        run: python3 scripts/check_github_action_pins.py
      - name: Enforce fail-closed release workflow structure
        run: python3 -I -S -B scripts/verify_release_workflow.py
      - name: Test supply-chain policy gates
        run: python3 -I -S -B -m unittest discover -s scripts/tests -p 'test_*.py'

  package:
    name: Self-contained package build (arm64)
    runs-on: macos-15
    env:
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_CPYTHON_BUILD: "20260718"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: '1.97.1'
      - name: Install exact uv and managed Python build toolchain
        run: |
          python3 -I -S -B scripts/install_pinned_uv_python.py \
            --install-root "$RUNNER_TEMP/scanstudio-uv-python"
      - name: Verify exact Rust toolchain
        run: python3 -I -S -B scripts/verify_pinned_rust.py
      - name: Install locked production bridge dependencies
        working-directory: bridge
        # python-sane is intentionally built by package_app.sh from its exact
        # locked sdist against the private source-pinned SANE link SDK.
        run: uv sync --locked --no-dev --no-install-package python-sane
      - name: Build and verify the local package
        # make package runs package_app.sh then test_packaged_bridge.sh on the
        # built ScanStudio.app -- the relocation-safe bridge check -- so this
        # leg proves the packaged app works on this runner's native arch.
        working-directory: app/ScanStudio
        run: make package
      - name: Preserve the exact signed app for the macOS 14 runtime gate
        working-directory: app/ScanStudio/.build
        run: ditto -c -k --sequesterRsrc --keepParent ScanStudio.app ScanStudio-app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScanStudio-app
          path: app/ScanStudio/.build/ScanStudio-app.zip
          if-no-files-found: error
          retention-days: 1

  package-macos-14:
    name: Self-contained package check (macOS 14 floor)
    # Swift 6 is not available in the macOS 14 runner's Xcode. Build and sign
    # once in the package job, then execute that exact arm64 app on the oldest
    # supported OS. The relocated package check loads the app-owned libusb and
    # exercises the bundled launchers without enumerating or moving hardware.
    runs-on: macos-14
    needs: package
    env:
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_CPYTHON_BUILD: "20260718"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install exact uv and managed Python build toolchain
        run: |
          python3 -I -S -B scripts/install_pinned_uv_python.py \
            --install-root "$RUNNER_TEMP/scanstudio-uv-python"
      - name: Warm the locked dependency cache for offline source verification
        working-directory: bridge
        run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScanStudio-app
          path: ${{ runner.temp }}/scanstudio-package
      - name: Unpack and verify the exact signed app on macOS 14
        run: |
          ditto -x -k "$RUNNER_TEMP/scanstudio-package/ScanStudio-app.zip" "$RUNNER_TEMP/scanstudio-package/unpacked"
          app/ScanStudio/scripts/test_packaged_bridge.sh "$RUNNER_TEMP/scanstudio-package/unpacked/ScanStudio.app"

  updater-integration:
    name: Updater integration gate
    # Reuses the exact signed app produced by the package job so the "release"
    # under test is the shipped artifact, not a dev build. Same-workflow job
    # ordering means the artifact is still present when this job runs, so the
    # package job's 1-day retention needs no bump.
    runs-on: macos-15
    needs: package
    env:
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_CPYTHON_BUILD: "20260718"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install exact uv and managed Python build toolchain
        run: |
          python3 -I -S -B scripts/install_pinned_uv_python.py \
            --install-root "$RUNNER_TEMP/scanstudio-uv-python"
      - name: Warm the locked dependency cache
        # Keeps the runner environment interchangeable with the other uv-managed
        # jobs (see the bridge job note) so script behaviour is reproducible.
        working-directory: bridge
        run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScanStudio-app
          path: ${{ runner.temp }}/scanstudio-updater
      - name: Unpack the packaged app for the updater gate
        run: |
          ditto -x -k "$RUNNER_TEMP/scanstudio-updater/ScanStudio-app.zip" "$RUNNER_TEMP/scanstudio-updater/unpacked"
      - name: Run the seeded updater verification against the exact packaged app
        # Both point at the same real app: the script seeds its feed from the
        # new-app bytes and the harness proves resolve -> download -> verify ->
        # snapshot -> swap -> rollback on its own synthetic old/new fixtures, so
        # the flow's hash + swap still prove out against the signed artifact.
        env:
          SCANSTUDIO_UPDATER_CURRENT_APP: ${{ runner.temp }}/scanstudio-updater/unpacked/ScanStudio.app
          SCANSTUDIO_UPDATER_NEW_APP: ${{ runner.temp }}/scanstudio-updater/unpacked/ScanStudio.app
        run: |
          scripts/verify_updater.sh 2>&1 | tee "$RUNNER_TEMP/verify_updater.log"
          grep -q "VERIFY_UPDATER OK" "$RUNNER_TEMP/verify_updater.log"

  verification-gate:
    name: Required verification gate
    if: ${{ always() }}
    needs:
      - app-and-engine
      - bridge
      - coolscanpy
      - supply-chain-policy
      - package
      - package-macos-14
      - updater-integration
    runs-on: ubuntu-22.04
    outputs:
      verified_sha: ${{ steps.prove.outputs.verified_sha }}
    steps:
      - id: prove
        name: Prove every required family succeeded for this commit
        run: |
          set -euo pipefail
          test "${{ needs.app-and-engine.result }}" = success
          test "${{ needs.bridge.result }}" = success
          test "${{ needs.coolscanpy.result }}" = success
          test "${{ needs.supply-chain-policy.result }}" = success
          test "${{ needs.package.result }}" = success
          test "${{ needs.package-macos-14.result }}" = success
          test "${{ needs.updater-integration.result }}" = success
          test -n "$GITHUB_SHA"
          echo "verified_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
