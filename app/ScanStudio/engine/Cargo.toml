[package]
name = "scanstudio-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["tiff", "png", "jpeg"] }
imageproc = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
